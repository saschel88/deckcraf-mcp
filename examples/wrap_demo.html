<h1>Перенос строк и рост холста</h1>
<p class="sub">Подписи переносятся на две строки, элемент подрастает в высоту. Односложное слово переносить нечем — там кегль уменьшается. Когда всё помещается в строку, холст остаётся прежним, 190.</p>

/* ── тёмная краска для подписи на светлой заливке ── */
const INK={flat:'#0d0f14',shadow:'#0f172a',iso:'#0d0f14',gradient:'#312e81',glass:'#08111f',

  aurora:'#231a47',line:'#0f2740',brutal:'#000000',memphis:'#1a1a1a'};

/* ── МАТРИЦА: изометрия снята с производства после четырёх отказов ── */
const ALLOW = {

/* ── отдельный токен для линий: связей, осей, спины.
   track остаётся заливкой жёлоба, где слабый контраст уместен ── */

  neon:'#2a3a5c',neuro:'#b6c0cf',duotone:'rgba(255,255,255,.32)',retro:'#5c4d14',clay:'#d9c8f0',

/* ── фирменные признаки стилей: обводка и блик.
   Вынесены в токены, чтобы при желании их тоже можно было перекрасить ── */
const HARD={brutal:'#000000',memphis:'#1a1a1a'};
const NEG ={flat:'#ef4444',shadow:'#dc2626',gradient:'#fca5a5',glass:'#f87171',neon:'#ef4444',
  neuro:'#c76b6b',duotone:'rgba(255,255,255,.55)',retro:'#e0533d',clay:'#ec4899',
  aurora:'#f87171',line:'#8b2020',brutal:'#000000',memphis:'#e11d48'};
Object.keys(ST).forEach(k=>{ST[k].hard=HARD[k]||ST[k].ink; ST[k].hi='#ffffff'; ST[k].neg=NEG[k]||'#ef4444';});

/* ══════════════════════════════════════════════════════════════
   БРЕНД-СЛОЙ
   Бренд задаёт входные цвета. Каждый стиль укладывает их в свою
   цветовую модель: нейморфизм монохромен, дуотон двухцветен,
   брутализм ахроматичен, мемфису нужны столкновения, ретро —
   ограниченный набор. Одним сдвигом светлоты это не описать.
   ══════════════════════════════════════════════════════════════ */
const BRAND = {
  accent : '#6366f1',
  accent2: '#8b5cf6',
  accent3: '#06b6d4',
  positive:'#10b981',
  enabled: false
};

/* ── работа с цветом ── */
function toHsl(hex){
  const m=/^#([0-9a-f]{6})$/i.exec(hex); if(!m)return null;
  const n=parseInt(m[1],16), r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  if(mx===mn)return{h:0,s:0,l:l};
  const dd=mx-mn, s=l>.5?dd/(2-mx-mn):dd/(mx+mn);
  let h; if(mx===r)h=((g-b)/dd+(g<b?6:0)); else if(mx===g)h=(b-r)/dd+2; else h=(r-g)/dd+4;
  return {h:h*60,s:s,l:l};
}
function toHex(h,s,l){
  h=((h%360)+360)%360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}
function shade(hex,k){
  const c=toHsl(hex); if(!c)return hex;
  return toHex(c.h,c.s,k>=1 ? c.l+(1-c.l)*(k-1) : c.l*k);
}
function rotate(hex,deg,sat,lig){
  const c=toHsl(hex); if(!c)return hex;
  return toHex(c.h+deg, sat!=null?sat:c.s, lig!=null?lig:c.l);
}
function mix(a,b,k){                       // k=0 → a, k=1 → b
  const A=toHsl(a),B=toHsl(b); if(!A||!B)return a;
  return toHex(A.h+(B.h-A.h)*k, A.s+(B.s-A.s)*k, A.l+(B.l-A.l)*k);
}

/* ── переходники: как каждый стиль принимает бренд ── */
const ADAPT = {

  /* светлота под фон — модель годится восьми стилям */
  _shift(s,B,k){
    s.ac =shade(B.accent ,k); s.ac2=shade(B.accent2,k);
    s.ac3=shade(B.accent3,k); s.pos=shade(B.positive,k);
  },
  flat    :(s,B)=>ADAPT._shift(s,B,1),
  shadow  :(s,B)=>ADAPT._shift(s,B,.82),
  glass   :(s,B)=>{ADAPT._shift(s,B,1.28);
    s_glass_a=shade(B.accent,1.05); s_glass_b=shade(B.accent3,1.05);},
  neon    :(s,B)=>ADAPT._shift(s,B,1.1),
  clay    :(s,B)=>{ADAPT._shift(s,B,1);
    s.defs=s.defs.replace(/flood-color="#[0-9a-f]{6}"/i,'flood-color="'+shade(B.accent,.85)+'"');},
  line    :(s,B)=>ADAPT._shift(s,B,.72),
  aurora  :(s,B)=>ADAPT._shift(s,B,.78),

  /* градиент: цвет живёт ещё и в заливках, их надо пересобрать */
  gradient:(s,B)=>{
    ADAPT._shift(s,B,1);
    const a=B.accent, mid=mix(B.accent,B.accent3,.5), c=B.accent3;
    s.defs=`<linearGradient id="g-card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${a}"/><stop offset="55%" stop-color="${mid}"/><stop offset="100%" stop-color="${c}"/></linearGradient>
  <linearGradient id="g-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${a}"/><stop offset="100%" stop-color="${c}"/></linearGradient>
  <linearGradient id="g-barv" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="${a}"/><stop offset="100%" stop-color="${c}"/></linearGradient>`;
  },

  /* нейморфизм монохромен: цвет несёт поверхность, акцент один,
     остальные роли — тот же тон другой светлоты */
  neuro:(s,B)=>{
    const h=toHsl(B.accent);
    s.surf=s.bg=toHex(h.h,.14,.90);              // поверхность чуть тонирована брендом
    s.track=toHex(h.h,.12,.79);
    s.ln   =toHex(h.h,.12,.74);
    s.tp   =toHex(h.h,.18,.32); s.ts=toHex(h.h,.12,.60); s.tm=toHex(h.h,.10,.70);
    s.ink  =s.tp;
    s.ac   =toHex(h.h,Math.max(h.s,.5),.55);
    s.ac2  =toHex(h.h,Math.max(h.s,.5),.44);     // тот же тон, другая светлота
    s.ac3  =toHex(h.h,Math.max(h.s,.5),.66);
    s.pos  =toHex(h.h,.34,.50);

  memphis:(s,B)=>{

function track(s,x,y,w,h){

/* ── шеврон: форма зависит от стиля ── */
function chev(s,x,y,w,h,c,first){
  const n=(s.mode==='retro'||s.mode==='brutal')?0:11, gl=s.glow?` filter="${s.glow}"`:'';
  if(s.mode==='clay')
    return `<rect x="${x}" y="${y}" width="${w-5}" height="${h}" rx="${h/2}" fill="${c}"/>`+
           `<rect x="${x+7}" y="${y+3}" width="${w-19}" height="${(h*.28).toFixed(1)}" rx="${(h*.14).toFixed(1)}" fill="#fff" fill-opacity=".3"/>`;
  let pts;
  if(n===0) pts=`${x},${y} ${x+w},${y} ${x+w},${y+h} ${x},${y+h}`;
  else if(first) pts=`${x},${y} ${x+w-n},${y} ${x+w},${y+h/2} ${x+w-n},${y+h} ${x},${y+h}`;
  else pts=`${x},${y} ${x+w-n},${y} ${x+w},${y+h/2} ${x+w-n},${y+h} ${x},${y+h} ${x+n},${y+h/2}`;
  if(s.mode==='line')   return `<polygon points="${pts}" fill="none" stroke="${c}" stroke-width="1.6"/>`;
  if(s.mode==='neon')   return `<polygon points="${pts}" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-width="1.4"${gl}/>`;
  if(s.mode==='brutal') return `<polygon points="${pts}" fill="${c}" stroke="#000" stroke-width="3"/>`;
  if(s.mode==='memphis')return `<polygon points="${pts}" fill="${c}" stroke="#1a1a1a" stroke-width="1.5"/>`;
  if(s.mode==='iso'){const d=7,e=-5;
    return `<polygon points="${x},${y} ${x+d},${y+e} ${x+w+d},${y+e} ${x+w},${y}" fill="${c}" opacity=".72"/>`+
           `<polygon points="${x+w},${y} ${x+w+d},${y+e} ${x+w+d},${y+h+e} ${x+w},${y+h}" fill="${c}" opacity=".48"/>`+
           `<polygon points="${pts}" fill="${c}"/>`;}
  const op=(s.mode==='glass'||s.mode==='aurora')?.5:1;
  return `<polygon points="${pts}" fill="${c}" fill-opacity="${op}"${s.mode==='glass'?` stroke="${c}" stroke-opacity=".7" stroke-width="1"`:''}/>`;

/* ── узел-коробка ── */

  else if(s.mode==='memphis')o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="${c}" stroke="#1a1a1a" stroke-width="1.5"/>`;
  else if(s.mode==='iso'){const d=6,e=-4;
    o=`<polygon points="${x},${y} ${x+d},${y+e} ${x+w+d},${y+e} ${x+w},${y}" fill="${c}" opacity=".72"/>`+
      `<polygon points="${x+w},${y} ${x+w+d},${y+e} ${x+w+d},${y+h+e} ${x+w},${y+h}" fill="${c}" opacity=".48"/>`+
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;}
  else{const op=(s.mode==='glass'||s.mode==='aurora')?.5:1;
    o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="${c}" fill-opacity="${op}"${s.mode==='glass'?` stroke="${c}" stroke-opacity=".65" stroke-width="1"`:''}/>`;}

function lumOf(s,c){
  const darkBg=['flat','iso','gradient','glass','neon','duotone','retro','aurora'].includes(s.mode);
  if(/^url\(/.test(c))return null;              // градиент оценить нельзя
  let m=/^#([0-9a-f]{3})$/i.exec(c);             // короткая запись: #fff
  if(m){const h=m[1],n=parseInt(h[0]+h[0]+h[1]+h[1]+h[2]+h[2],16);
    return ((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255;}
  m=/^#([0-9a-f]{6})$/i.exec(c);
  if(m){const n=parseInt(m[1],16);
    const l=((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255;
    return (s.mode==='glass')? l*0.62 : l;}
  const damp=(s.mode==='glass')?0.5:1;          // полупрозрачная заливка поверх тёмного
  m=/rgba?\(([^)]+)\)/.exec(c);
  if(m){const p=m[1].split(',').map(Number),a=p[3]===undefined?1:p[3];
    const l=(p[0]*.299+p[1]*.587+p[2]*.114)/255;
    return darkBg? l*a*damp : l;}
  return null;

  if(c===s.ac &&s.bgAc )return s.bgAc;                // иначе смысл цвета теряется
  if(c===s.ac2&&s.bgAc2)return s.bgAc2;
  if(c===s.ac3&&s.bgAc3)return s.bgAc3;
  return s.tp;
}
function nodeTx(s,c){
  if(s.mode==='line'||s.mode==='neon')return c;

function conn(s,x1,y1,x2,y2){
  const d=s.mode==='retro'?'':' stroke-dasharray="3 3"';

/* ══════ ПЕРЕНОС СТРОК И РОСТ ХОЛСТА ══════ */

/* Разбить строку не более чем на maxLines строк по ширине maxW.
   Односложное не переносится — для него остаётся уменьшение кегля. */
function wrap(str,maxW,fs,maxLines){
  maxLines=maxLines||2;
  const per=fs*0.55;
  if(str.length*per<=maxW) return [str];
  const words=String(str).split(/\s+/);
  if(words.length===1) return [str];
  const lines=[]; let cur='';
  for(let i=0;i<words.length;i++){
    const cand=cur?cur+' '+words[i]:words[i];
    if(!cur || cand.length*per<=maxW){ cur=cand; }
    else{
      lines.push(cur); cur=words[i];
      if(lines.length===maxLines-1){ cur=words.slice(i).join(' '); break; }
    }
  }
  lines.push(cur);
  return lines.slice(0,maxLines);
}
/* Уложить набор подписей: сначала перенос, затем — если односложное
   всё равно не влезает — единый уменьшенный кегль на весь набор */
function fitLines(labels,maxW,fs,maxLines,minFs){
  maxLines=maxLines||2; minFs=minFs||fs*0.72;
  let f=fs, out;
  for(;;){
    out=labels.map(l=>wrap(l,maxW,f,maxLines));
    const over=out.some(ls=>ls.some(ln=>ln.length*f*0.55>maxW));
    if(!over || f<=minFs) break;
    f-=0.5;
  }
  return {lines:out, fs:f, n:out.reduce((m,ls)=>Math.max(m,ls.length),1)};
}

/* Сколько строк понадобится набору подписей */
function maxLinesOf(labels,maxW,fs,cap){
  return labels.reduce((m,l)=>Math.max(m,wrap(l,maxW,fs,cap||2).length),1);
}
/* Отрисовать многострочную подпись */
function txtLines(s,x,y,lines,fs,weight,fill,anchor,lh){
  lh=lh||fs*1.25;
  return lines.map((ln,i)=>{
    let t=txt(s,x,y+i*lh,ln,fs,weight,fill,null);
    if(anchor) t=t.replace('<text ','<text text-anchor="'+anchor+'" ');
    return t;
  }).join('');
}
/* Холст переменной высоты */
function wrapSvgH(s,inner,hh){
  const cr=s.crisp?' shape-rendering="crispEdges"':'';
  const top=(s.deco&&s.decoTop)?s.deco(W,hh):'';
  return `<svg viewBox="0 0 ${W} ${hh}" xmlns="http://www.w3.org/2000/svg"${cr}>${s.defs?`<defs>${s.defs}</defs>`:''}${inner}${top}</svg>`;
}
function frameH(s,hh){
  let o=`<rect width="${W}" height="${hh}" fill="${s.bg}"/>`;
  if(s.deco&&!s.decoTop) o+=s.deco(W,hh);
  return o;
}

/* ── Столбчатый график: высота растёт под двухстрочные подписи ── */
function dColumn2(s,d){
  const x=PAD, y=PAD, w=W-PAD*2;
  const n=d.bars.length;
  const ox=x+26, pw=w-58;
  const bw=Math.max(10,Math.floor(pw/n)-10);
  const L=fitLines(d.bars.map(b=>b.label), bw+8, 10, 2, 7.5);
  const labFs=L.fs, labH=L.n*labFs*1.25;

  // при одной строке холст остаётся прежним, 190; рост только когда нужен
  const plotH=72;
  const H2=PAD + 22 + 28 + plotH + 12 + labH + 16 + PAD;
  const h=H2-PAD*2;

  let o=frameH(s,H2)+surface(s,x,y,w,h);
  o+=txt(s,x+20,y+22,t(s,d.title),12,s.wl,s.ts,s.ls);
  const oy=y+22, baseY=oy+28+plotH, mx=Math.max(...d.bars.map(b=>b.v));
  o+=`<line x1="${ox}" y1="${baseY}" x2="${ox+pw}" y2="${baseY}" stroke="${s.ln}" stroke-width="${s.mode==='brutal'?3:1}"/>`;
  d.bars.forEach((b,i)=>{
    const bh=Math.round(plotH*b.v/mx), bx=ox+i*(bw+10);
    const c=b.hi?s.ac:s.ac3;
    o+=shape(s,bx,baseY-bh,bw,bh,c,0);
    o+=txtLines(s,bx+bw/2,baseY+12+labFs*0.72,L.lines[i],labFs,s.wl,
        b.hi?bgTx(s,s.ac):s.tm,'middle',labFs*1.25);
  });
  return wrapSvgH(s,o,H2);
}

const SETS=[

];

    c.innerHTML='<div class="v" style="background:'+ST[k].bg+'">'+svg+'</div>'+

      '<div class="ms">холст 300×'+hh.toFixed(0)+' · кегль '+L.fs+' · строк '+L.n+'</div></div>';
