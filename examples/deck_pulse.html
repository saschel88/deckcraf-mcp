const HARD={brutal:'#000000',memphis:'#1a1a1a'};
const NEG ={flat:'#ef4444',shadow:'#dc2626',gradient:'#fca5a5',glass:'#f87171',neon:'#ef4444',

/* ══════════════════════════════════════════════════════════════
   БРЕНД-СЛОЙ
   Бренд задаёт входные цвета. Каждый стиль укладывает их в свою
   цветовую модель: нейморфизм монохромен, дуотон двухцветен,
   брутализм ахроматичен, мемфису нужны столкновения, ретро —
   ограниченный набор. Одним сдвигом светлоты это не описать.
   ══════════════════════════════════════════════════════════════ */
const BRAND = {
  accent : '#6366f1',
  accent2: '#8b5cf6',
  accent3: '#06b6d4',
  positive:'#10b981',
  enabled: false
};

/* ── работа с цветом ── */
function toHsl(hex){
  const m=/^#([0-9a-f]{6})$/i.exec(hex); if(!m)return null;
  const n=parseInt(m[1],16), r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  if(mx===mn)return{h:0,s:0,l:l};
  const dd=mx-mn, s=l>.5?dd/(2-mx-mn):dd/(mx+mn);
  let h; if(mx===r)h=((g-b)/dd+(g<b?6:0)); else if(mx===g)h=(b-r)/dd+2; else h=(r-g)/dd+4;
  return {h:h*60,s:s,l:l};
}
function toHex(h,s,l){
  h=((h%360)+360)%360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}
function shade(hex,k){
  const c=toHsl(hex); if(!c)return hex;
  return toHex(c.h,c.s,k>=1 ? c.l+(1-c.l)*(k-1) : c.l*k);
}
function rotate(hex,deg,sat,lig){
  const c=toHsl(hex); if(!c)return hex;
  return toHex(c.h+deg, sat!=null?sat:c.s, lig!=null?lig:c.l);
}
function mix(a,b,k){                       // k=0 → a, k=1 → b
  const A=toHsl(a),B=toHsl(b); if(!A||!B)return a;
  return toHex(A.h+(B.h-A.h)*k, A.s+(B.s-A.s)*k, A.l+(B.l-A.l)*k);
}

/* ── переходники: как каждый стиль принимает бренд ── */
const ADAPT = {

  /* светлота под фон — модель годится восьми стилям */
  _shift(s,B,k){
    s.ac =shade(B.accent ,k); s.ac2=shade(B.accent2,k);
    s.ac3=shade(B.accent3,k); s.pos=shade(B.positive,k);
  },
  flat    :(s,B)=>ADAPT._shift(s,B,1),
  shadow  :(s,B)=>ADAPT._shift(s,B,.82),
  glass   :(s,B)=>{ADAPT._shift(s,B,1.28);
    s_glass_a=shade(B.accent,1.05); s_glass_b=shade(B.accent3,1.05);},
  neon    :(s,B)=>ADAPT._shift(s,B,1.1),
  clay    :(s,B)=>{ADAPT._shift(s,B,1);
    s.defs=s.defs.replace(/flood-color="#[0-9a-f]{6}"/i,'flood-color="'+shade(B.accent,.85)+'"');},
  line    :(s,B)=>ADAPT._shift(s,B,.72),
  aurora  :(s,B)=>ADAPT._shift(s,B,.78),

  /* градиент: цвет живёт ещё и в заливках, их надо пересобрать */
  gradient:(s,B)=>{
    ADAPT._shift(s,B,1);
    const a=B.accent, mid=mix(B.accent,B.accent3,.5), c=B.accent3;
    s.defs=`<linearGradient id="g-card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${a}"/><stop offset="55%" stop-color="${mid}"/><stop offset="100%" stop-color="${c}"/></linearGradient>
  <linearGradient id="g-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${a}"/><stop offset="100%" stop-color="${c}"/></linearGradient>
  <linearGradient id="g-barv" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="${a}"/><stop offset="100%" stop-color="${c}"/></linearGradient>`;
  },

  /* нейморфизм монохромен: цвет несёт поверхность, акцент один,
     остальные роли — тот же тон другой светлоты */
  neuro:(s,B)=>{
    const h=toHsl(B.accent);
    s.surf=s.bg=toHex(h.h,.14,.90);              // поверхность чуть тонирована брендом
    s.track=toHex(h.h,.12,.79);
    s.ln   =toHex(h.h,.12,.74);
    s.tp   =toHex(h.h,.18,.32); s.ts=toHex(h.h,.12,.60); s.tm=toHex(h.h,.10,.70);
    s.ink  =s.tp;
    s.ac   =toHex(h.h,Math.max(h.s,.5),.55);
    s.ac2  =toHex(h.h,Math.max(h.s,.5),.44);     // тот же тон, другая светлота
    s.ac3  =toHex(h.h,Math.max(h.s,.5),.66);
    s.pos  =toHex(h.h,.34,.50);
    s.defs=s.defs.replace(/flood-color="#[0-9a-f]{6}"/gi,'flood-color="'+toHex(h.h,.14,.72)+'"');
  },

  /* дуотон двухцветен по определению: два крайних тона, остальное прозрачностью */
  duotone:(s,B)=>{
    const from=shade(B.accent,.55), to=shade(B.accent3,.45);
    s.defs=`<linearGradient id="g-dt" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${from}"/><stop offset="100%" stop-color="${to}"/></linearGradient>`;
    s.ac='rgba(255,255,255,.95)'; s.ac2='rgba(255,255,255,.78)';
    s.ac3='rgba(255,255,255,.62)'; s.pos='rgba(255,255,255,.86)';
    s.bg=shade(B.accent,.18);
  },

  /* брутализм ахроматичен: бренд заходит только сигналом */
  brutal:(s,B)=>{ s.pos=B.accent; },

  /* мемфису нужны столкновения: достраиваем тона по кругу */
  memphis:(s,B)=>{
    const h=toHsl(B.accent), S=Math.max(h.s,.72), L=.48;
    s.ac =toHex(h.h,       S,L);
    s.ac2=toHex(h.h+152,   S,L);
    s.ac3=toHex(h.h+ 68,   S,L);
    s.pos=toHex(h.h+218,   S,L);
    s.bg =toHex(h.h+ 40,.62,.96);
  },

  /* ретро: ограниченный набор, высокая насыщенность, фиксированная светлота */
  retro:(s,B)=>{
    const h=toHsl(B.accent), S=.78, L=.56;
    s.ac =toHex(h.h,      S,L);
    s.ac2=toHex(h.h+128,  S,L);
    s.ac3=toHex(h.h+ 40,  S,L);
    s.pos=toHex(h.h+128,  S,L);
    s.bd =s.ac;
    s.bg =toHex(h.h,.42,.04); s.surf=toHex(h.h,.30,.07);
    s.tp =s.ac; s.ts=toHex(h.h,S,.34); s.tm=toHex(h.h,S,.24);
  }
};

function applyBrand(){
  if(!BRAND.enabled) return;
  Object.keys(ST).forEach(k=>{
    const fn=ADAPT[k]; if(typeof fn==='function') fn(ST[k],BRAND);
  });
  // светлые варианты для стилей без панели пересчитываем после переходников
  Object.keys(ST).forEach(k=>{const s=ST[k];
    if(s.bgAc ) s.bgAc =shade(s.ac ,1.9);
    if(s.bgAc2) s.bgAc2=shade(s.ac2,1.9);
    if(s.bgAc3) s.bgAc3=shade(s.ac3,1.9);
    if(s.bgPos) s.bgPos=shade(s.pos,1.9);
  });
}
applyBrand();


const W=300,H=190,PAD=14;

/* ── помощники ── */
const t=(s,str)=>s.caps?str.toUpperCase():str;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function txt(s,x,y,str,size,weight,fill,ls){
  return `<text x="${x}" y="${y}" fill="${fill}" font-family="${s.ff}" font-size="${size}" font-weight="${weight}"${ls!=null?` letter-spacing="${ls}"`:''}>${esc(str)}</text>`;
}
// подложка карточки по правилам стиля
function surface(s,x,y,w,h){
  if(s.mode==='aurora') return '';

    const{dx,dy}=s;
    return `<polygon points="${x+w},${y} ${x+w+dx},${y+dy} ${x+w+dx},${y+h+dy} ${x+w},${y+h}" fill="#2c3352"/>`+
           `<polygon points="${x},${y} ${x+dx},${y+dy} ${x+w+dx},${y+dy} ${x+w},${y}" fill="#414a75"/>`+
           `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${s.surf}"/>`;
  }

    return `<rect x="${x+10}" y="${y+10}" width="${w}" height="${h}" fill="#000"/>`+
           `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${s.surf}" stroke="${s.bd}" stroke-width="${s.bdw}"/>`;
  }
  const fx=s.surfFx?` filter="${s.surfFx}"`:'';
  const gl=s.glow?` filter="${s.glow}"`:'';
  const st=s.bd?` stroke="${s.bd}" stroke-width="${s.bdw}"`:'';

  let out=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${s.r}" fill="${fill}"${st}${fx||gl}/>`;
  if(s.mode==='glass') out+=`<path d="M${x+18} ${y+1.5} H${x+w-18}" stroke="#fff" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round"/>`;

// прямоугольный «полосатый» примитив — используется в барах и колонках
function shape(s,x,y,w,h,color,horiz){
  const gl=s.glow?` filter="${s.glow}"`:'';
  switch(s.mode){
    case 'line':   return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="none" stroke="${color}" stroke-width="1.5"/>`;
    case 'neon':   return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${color}" fill-opacity=".16" stroke="${color}" stroke-width="1.3"${gl}/>`;
    case 'retro':{ // ступенчатые блоки
      let o='',step=horiz?9:0;
      if(horiz){for(let i=0;i<Math.floor(w/9);i++)o+=`<rect x="${x+i*9}" y="${y}" width="7" height="${h}" fill="${color}"/>`;}
      else{for(let i=0;i<Math.floor(h/9);i++)o+=`<rect x="${x}" y="${y+h-(i+1)*9}" width="${w}" height="7" fill="${color}"/>`;}

    case 'iso':{const d=8,e=-5;
      return `<polygon points="${x+w},${y} ${x+w+d},${y+e} ${x+w+d},${y+h+e} ${x+w},${y+h}" fill="${color}" opacity=".55"/>`+
             `<polygon points="${x},${y} ${x+d},${y+e} ${x+w+d},${y+e} ${x+w},${y}" fill="${color}" opacity=".78"/>`+
             `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}"/>`;}
    case 'clay':   return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w,h)/2}" fill="${color}"/>`+
                          (horiz?`<rect x="${x+3}" y="${y+2}" width="${Math.max(w-6,0)}" height="${Math.max(h*.32,2)}" rx="${h*.16}" fill="#fff" fill-opacity=".3"/>`:'');
    case 'brutal': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" stroke="#000" stroke-width="2"/>`;
    case 'neuro':  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w,h)/2}" fill="${color}"/>`;
    case 'gradient':return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${horiz?'url(#g-bar)':'url(#g-barv)'}"/>`;
    case 'glass':  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${color}" fill-opacity=".42" stroke="${color}" stroke-opacity=".7" stroke-width="1"/>`;
    case 'memphis':return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${color}" stroke="#1a1a1a" stroke-width="1.5"/>`;

/* плашка-дельта: у каждого стиля своя заливка, контраст текста гарантирован */
function chip(s,x,y,label){
  const w=98,h=26,gl=s.glow?` filter="${s.glow}"`:'';
  const tx=x+13,ty=y+17.5;
  const T=(fill,size)=>txt(s,tx,ty,label,size||12.5,600,fill,null);
  switch(s.mode){
    case 'aurora': return txt(s,x,ty,label,12.5,600,'rgba(255,255,255,.92)',null);
    case 'line':   return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="none" stroke="${s.pos}" stroke-width="1.2"/>`+T(s.pos);
    case 'neon':   return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="none" stroke="${s.pos}" stroke-width="1.2"${gl}/>`+txt(s,tx,ty,label,12.5,600,s.pos,null).replace('<text ',`<text filter="${s.glow}" `);
    case 'brutal': return `<rect x="${x}" y="${y}" width="${w+14}" height="${h+3}" fill="#000"/>`+txt(s,tx,ty+1.5,label,12.5,800,'#fff',null);
    case 'clay':   return `<rect x="${x}" y="${y-2}" width="${w+10}" height="${h+4}" rx="${(h+4)/2}" fill="${s.ac}" filter="${s.surfFx}"/>`+
                          `<rect x="${x+5}" y="${y+1}" width="${w}" height="9" rx="4.5" fill="#fff" fill-opacity=".28"/>`+txt(s,tx,ty,label,12.5,700,'#fff',null);
    case 'memphis':return `<rect x="${x}" y="${y-2}" width="${w+8}" height="${h+4}" rx="${(h+4)/2}" fill="${s.pos}"/>`+txt(s,tx,ty,label,12.5,700,'#fff',null);
    case 'neuro':  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="13" fill="${s.surf}" filter="${s.inFx}"/>`+T(s.pos);
    case 'shadow': return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="13" fill="#e7f7ef"/>`+T('#047857');
    case 'glass':  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="13" fill="${s.pos}" fill-opacity=".2" stroke="${s.pos}" stroke-opacity=".45" stroke-width="1"/>`+T(s.pos);
    case 'gradient':
    case 'duotone':return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#fff" fill-opacity=".2"/>`+T('#fff');
    case 'retro':{ // дельта шкалой блоков вместо текста
      let o='';for(let i=0;i<5;i++)o+=`<rect x="${x+i*12}" y="${y+4}" width="9" height="17" fill="${i<4?s.pos:'#2a5c40'}"/>`;
      return o+txt(s,x+66,ty,'+23%',12.5,700,s.pos,null);}
    case 'iso':    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${s.pos}" fill-opacity=".2"/>`+T(s.pos);
    default:       return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${s.pos}" fill-opacity=".16"/>`+T(s.pos);

function track(s,x,y,w,h){
  if(s.mode==='line')  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="none" stroke="${s.ln}" stroke-width="1"/>`;
  if(s.mode==='neuro') return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="${s.surf}" filter="${s.inFx}"/>`;
  if(s.mode==='brutal')return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${s.track}" stroke="#000" stroke-width="2"/>`;
  if(s.mode==='retro') return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${s.track}"/>`;
  const r=s.mode==='clay'?h/2:3;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${s.track}"/>`;
}
function frame(s){
  let o=`<rect width="${W}" height="${H}" fill="${s.bg}"/>`;
  if(s.deco&&!s.decoTop) o+=s.deco(W,H);
  return o;
}
function wrapSvg(s,inner){
  const cr=s.crisp?' shape-rendering="crispEdges"':'';
  const top=(s.deco&&s.decoTop)?s.deco(W,H):'';
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"${cr}>${s.defs?`<defs>${s.defs}</defs>`:''}${inner}${top}</svg>`;
}

/* ── шеврон: форма зависит от стиля ── */
function chev(s,x,y,w,h,c,first){
  const n=(s.mode==='retro'||s.mode==='brutal')?0:11, gl=s.glow?` filter="${s.glow}"`:'';
  if(s.mode==='clay')
    return `<rect x="${x}" y="${y}" width="${w-5}" height="${h}" rx="${h/2}" fill="${c}"/>`+
           `<rect x="${x+7}" y="${y+3}" width="${w-19}" height="${(h*.28).toFixed(1)}" rx="${(h*.14).toFixed(1)}" fill="#fff" fill-opacity=".3"/>`;
  let pts;
  if(n===0) pts=`${x},${y} ${x+w},${y} ${x+w},${y+h} ${x},${y+h}`;
  else if(first) pts=`${x},${y} ${x+w-n},${y} ${x+w},${y+h/2} ${x+w-n},${y+h} ${x},${y+h}`;
  else pts=`${x},${y} ${x+w-n},${y} ${x+w},${y+h/2} ${x+w-n},${y+h} ${x},${y+h} ${x+n},${y+h/2}`;
  if(s.mode==='line')   return `<polygon points="${pts}" fill="none" stroke="${c}" stroke-width="1.6"/>`;
  if(s.mode==='neon')   return `<polygon points="${pts}" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-width="1.4"${gl}/>`;
  if(s.mode==='brutal') return `<polygon points="${pts}" fill="${c}" stroke="#000" stroke-width="3"/>`;
  if(s.mode==='memphis')return `<polygon points="${pts}" fill="${c}" stroke="#1a1a1a" stroke-width="1.5"/>`;
  if(s.mode==='iso'){const d=7,e=-5;
    return `<polygon points="${x},${y} ${x+d},${y+e} ${x+w+d},${y+e} ${x+w},${y}" fill="${c}" opacity=".72"/>`+
           `<polygon points="${x+w},${y} ${x+w+d},${y+e} ${x+w+d},${y+h+e} ${x+w},${y+h}" fill="${c}" opacity=".48"/>`+
           `<polygon points="${pts}" fill="${c}"/>`;}
  const op=(s.mode==='glass'||s.mode==='aurora')?.5:1;
  return `<polygon points="${pts}" fill="${c}" fill-opacity="${op}"${s.mode==='glass'?` stroke="${c}" stroke-opacity=".7" stroke-width="1"`:''}/>`;
}
/* ── узел-коробка ── */
function node(s,x,y,w,h,c,label,fs){
  const gl=s.glow?` filter="${s.glow}"`:'';
  const rr=s.mode==='clay'?h/2:s.mode==='retro'||s.mode==='brutal'?0:6;
  let o;
  if(s.mode==='line')       o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="none" stroke="${c}" stroke-width="1.5"/>`;
  else if(s.mode==='neon')  o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="1.3"${gl}/>`;
  else if(s.mode==='brutal'){o=`<rect x="${x+4}" y="${y+4}" width="${w}" height="${h}" fill="#000"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" stroke="#000" stroke-width="3"/>`;c='#ffffff';}
  else if(s.mode==='memphis')o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="${c}" stroke="#1a1a1a" stroke-width="1.5"/>`;
  else if(s.mode==='iso'){const d=6,e=-4;
    o=`<polygon points="${x},${y} ${x+d},${y+e} ${x+w+d},${y+e} ${x+w},${y}" fill="${c}" opacity=".72"/>`+
      `<polygon points="${x+w},${y} ${x+w+d},${y+e} ${x+w+d},${y+h+e} ${x+w},${y+h}" fill="${c}" opacity=".48"/>`+
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;}
  else{const op=(s.mode==='glass'||s.mode==='aurora')?.5:1;
    o=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rr}" fill="${c}" fill-opacity="${op}"${s.mode==='glass'?` stroke="${c}" stroke-opacity=".65" stroke-width="1"`:''}/>`;}
  const tc=(s.mode==='brutal'&&lumOf(s,c)<.5)?'#fff':nodeTx(s,c);
  if(label)o+=txt(s,x+w/2,y+h/2+(fs||10)*0.25,t(s,label),fs||10,700,tc,null).replace('<text ','<text text-anchor="middle" ');
  return o;
}
function lumOf(s,c){
  const darkBg=['flat','iso','gradient','glass','neon','duotone','retro','aurora'].includes(s.mode);
  if(/^url\(/.test(c))return null;              // градиент оценить нельзя
  let m=/^#([0-9a-f]{3})$/i.exec(c);             // короткая запись: #fff
  if(m){const h=m[1],n=parseInt(h[0]+h[0]+h[1]+h[1]+h[2]+h[2],16);
    return ((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255;}
  m=/^#([0-9a-f]{6})$/i.exec(c);
  if(m){const n=parseInt(m[1],16);
    const l=((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255;
    return (s.mode==='glass')? l*0.62 : l;}
  const damp=(s.mode==='glass')?0.5:1;          // полупрозрачная заливка поверх тёмного
  m=/rgba?\(([^)]+)\)/.exec(c);
  if(m){const p=m[1].split(',').map(Number),a=p[3]===undefined?1:p[3];
    const l=(p[0]*.299+p[1]*.587+p[2]*.114)/255;
    return darkBg? l*a*damp : l;}
  return null;
}
function onNode(s,c){return s.mode==='brutal' ? '#000' : nodeTx(s,c);}  // узел brutal всегда белый
function bgTx(s,c){                                   // текст прямо на фоне, без фигуры под ним
  if(s.surf!==null)return c;                          // есть панель — цвет как есть
  if(c===s.pos&&s.bgPos)return s.bgPos;               // у стилей без панели — светлые варианты,
  if(c===s.ac &&s.bgAc )return s.bgAc;                // иначе смысл цвета теряется
  if(c===s.ac2&&s.bgAc2)return s.bgAc2;
  if(c===s.ac3&&s.bgAc3)return s.bgAc3;
  return s.tp;
}
function nodeTx(s,c){
  if(s.mode==='line'||s.mode==='neon')return c;
  const L=lumOf(s,c);
  return (L!==null&&L>.62) ? s.ink : '#fff';
}
function conn(s,x1,y1,x2,y2){
  const d=s.mode==='retro'?'':' stroke-dasharray="3 3"';
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s.ln}" stroke-width="${s.mode==='brutal'?2.5:1.2}"${d}/>`;
}






/* ══════════════════════════════════════════════════════════════
   ЭЛЕМЕНТЫ С ДАННЫМИ
   Каждая функция принимает (s, d): s — стиль, d — данные.
   Раскладка выводится из количества строк, а не из констант.
   ══════════════════════════════════════════════════════════════ */

/* подгонка строки под ширину: сначала кегль, потом обрезка */
function fit(str,maxW,fs,min){
  min=min||fs*0.72;
  let f=fs;
  while(f>min && str.length*f*0.55>maxW) f-=0.5;
  if(str.length*f*0.55>maxW){
    const n=Math.max(1,Math.floor(maxW/(f*0.55))-1);
    return [str.slice(0,n)+'…', f];
  }
  return [str,f];
}
/* распределение n строк по доступной высоте */
function rows(top,avail,n,minH,maxH){
  const h=Math.max(minH,Math.min(maxH,(avail-(n-1)*Math.max(3,avail*0.04))/n));
  const g=n>1?Math.min((avail-n*h)/(n-1),avail*0.06):0;
  return {h:h,g:g,y:i=>top+i*(h+g)};
}

// ── Титульный / разделитель
function dDivider(s,d){
  const x=PAD,y=PAD,w=W-PAD*2,h=H-PAD*2,cx=x+w/2;
  const ac=s.mode==='brutal'?s.ink:bgTx(s,s.ac);
  let o=frame(s)+surface(s,x,y,w,h);
  if(d.eyebrow)o+=txt(s,cx,y+38,t(s,d.eyebrow),9,600,s.tm,3).replace('<text ','<text text-anchor="middle" ');
  if(d.num)o+=txt(s,cx,y+80,d.num,44,s.wv,ac,-1.5).replace('<text ','<text text-anchor="middle" ');
  const [tt,tf]=fit(d.title,w-40,18,13);
  o+=txt(s,cx,y+110,t(s,tt),tf,s.wv,s.mode==='neon'||s.mode==='retro'?s.ac:s.tp,-.4).replace('<text ','<text text-anchor="middle" ');

      '<div class="s-cols"><div class="s-left">'+
        (sl.lead?'<p class="s-lead">'+sl.lead+'</p>':'')+
        (sl.body.length?'<ul class="s-body">'+sl.body.map(b=>'<li>'+b+'</li>').join('')+'</ul>':'')+
      '</div><div class="s-right">'+svg+'</div></div>';
  }
  d.innerHTML=inner+'<div class="s-num">'+(idx+1)+' / '+SLIDES.length+'</div>';
  deck.appendChild(d);
});

</script></body></html>
